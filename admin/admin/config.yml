backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "about"
    label: "About Me"
    files:
      - name: "about"
        label: "About Me Content"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Intro", name: "intro", widget: "markdown" }
          - label: "Paid Advertising Skills"
            name: "paid_ads"
            widget: "list"
            fields:
              - { label: "Skill Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Tracking Skills"
            name: "tracking"
            widget: "list"
            fields:
              - { label: "Skill Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - { label: "Goal Statement", name: "goal", widget: "markdown" }

  - name: "services"
    label: "My Services"
    folder: "content/services"
    create: true
    fields:
      - { label: "Service Name", name: "title", widget: "string" }
      - { label: "Icon (FontAwesome class)", name: "icon", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }

  - name: "portfolio"
    label: "Portfolio"
    folder: "content/portfolio"
    create: true
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - label: "Tags"
        name: "tags"
        widget: "list"
        field: { label: "Tag", name: "tag", widget: "string" }

  - name: "reviews"
    label: "Client Reviews"
    folder: "content/reviews"
    create: true
    fields:
      - { label: "Client Name", name: "name", widget: "string" }
      - { label: "Client Title", name: "title", widget: "string" }
      - { label: "Review", name: "review", widget: "text" }
      - { label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5 }
